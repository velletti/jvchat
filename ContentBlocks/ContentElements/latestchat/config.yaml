name: jvelletti/latestchat
description: Show the latest entries from a chatroom
group: chat
prefixFields: false
fields:
  - identifier: header
    label: Room name
    useExistingField: true

  - identifier: pi_flexform
    label: Chatroom configuration
    useExistingField: true
    type: FlexForm
    fields:
      - identifier: sDEF
        type: Sheet
        label: 'LLL:EXT:jvchat/Resources/Private/Language/locallang_db.xlf:tt_content.pi_flexform.sheet_general'
        fields:
          - identifier: chatroom
            type: Relation
            label: 'LLL:EXT:jvchat/Resources/Private/Language/locallang_db.xlf:tt_content.pi_flexform.chatroom'
            allowed: tx_jvchat_room
            size: 1
            maxitems: 1
          - identifier: chatwindow
            type: Relation
            label: 'LLL:EXT:jvchat/Resources/Private/Language/locallang_db.xlf:tt_content.pi_flexform.chat_window'
            allowed: pages
            size: 1
            maxitems: 1
          - identifier: amount
            label: Show only entries during last xxx days
            type: Number
            min: 1
            max: 999
            defaultValue: 30